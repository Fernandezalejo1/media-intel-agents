name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pyproject declara el extra dev (pytest + pytest-asyncio) y fija
      # testpaths=tests y pythonpath=src, asi que pytest corre sin argumentos.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Import del paquete
        run: python -c "import media_intel; print(media_intel.__name__)"
