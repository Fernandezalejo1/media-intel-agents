[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-intel-agents"
version = "0.1.0"
description = "Production-grade multi-agent media intelligence platform: supervisor + specialist agents, tool calling, RAG, HITL approvals, MLflow-compatible tracing, and Databricks-ready adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.30",
    "mlflow>=2.16",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
